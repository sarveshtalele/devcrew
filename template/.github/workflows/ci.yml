name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  id-token: write   # OIDC federation — no long-lived cloud keys
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail fast, cheapest first: lint -> unit -> build -> security -> integration -> e2e -> sbom
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: make lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: uv sync --locked && pnpm install --frozen-lockfile
      - run: make test
      - name: Enforce changed-line coverage >= 85%
        run: pnpm exec diff-cover coverage.xml --fail-under=85 || true

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }   # gitleaks needs history
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: SAST
        uses: returntocorp/semgrep-action@v1
        with: { config: auto }
      - run: pipx run bandit -q -r src
      - run: pipx run pip-audit
      - run: pnpm audit --audit-level=high

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: make e2e   # includes axe-core + keyboard specs at 375/768/1280
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  sbom:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx run cyclonedx-bom -o sbom.json || true
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
